[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compact-audit"
version = "0.1.0"
description = "Offline surface matching audit of compaction summaries"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
compact-audit = "compact_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
